<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deploy Check · Payanam</title>
<style>
  :root { --bg: #f6f4ef; --card: #fff; --ink: #17262b; --muted: #5d6b70; --line: #e3dfd6; --ok: #2f8f5b; --ok-soft: #e4f4ea; --bad: #b4412f; --bad-soft: #fbe9e5; --brand: #0f5257; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e1a1c; --card: #152427; --ink: #e6eeee; --muted: #9fb0b2; --line: #2a3b3e; --ok: #4cbf82; --ok-soft: #173426; --bad: #f08a77; --bad-soft: #3a1f1a; --brand: #7fd0d4; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: 100%; max-width: 520px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px; }
  h1 { margin: 0 0 4px; font-size: 1.4rem; }
  p { margin: 0; color: var(--muted); }
  .status { display: flex; align-items: center; gap: 10px; margin: 20px 0; padding: 12px 14px; border-radius: 10px; font-weight: 700; }
  .status.ok { background: var(--ok-soft); color: var(--ok); }
  .status.bad { background: var(--bad-soft); color: var(--bad); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; flex: none; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0; font-size: .95rem; }
  dt { color: var(--muted); }
  dd { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
  a { color: var(--brand); font-weight: 600; }
  .foot { margin-top: 20px; font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>GitHub → Vercel deploy check</h1>
  <p>This page was added by a test commit. If you can read it, Vercel deployed the push.</p>
  <div class="status" id="status"><span class="dot"></span><span id="statusText">Checking the server…</span></div>
  <dl>
    <dt>Repository</dt><dd id="repo">–</dd>
    <dt>Branch</dt><dd id="branch">–</dd>
    <dt>Commit</dt><dd id="commit">–</dd>
    <dt>Environment</dt><dd id="env">–</dd>
    <dt>Server time</dt><dd id="time">–</dd>
  </dl>
  <p class="foot"><a href="/">Go to the bus booking site</a></p>
</main>
<script>
  const set = (id, v) => { document.getElementById(id).textContent = v || '–'; };
  fetch('/api/health', { cache: 'no-store' })
    .then((r) => r.json())
    .then((d) => {
      const ok = d.status === 'ok' && d.deployedFromGit;
      const box = document.getElementById('status');
      box.className = 'status ' + (ok ? 'ok' : 'bad');
      set('statusText', ok ? 'Connected: this build came from GitHub' : 'Server is up, but this build did not come from a Git push');
      set('repo', d.repo); set('branch', d.branch);
      set('commit', d.commit + (d.commitMessage ? ' · ' + d.commitMessage.split('\n')[0] : ''));
      set('env', d.environment);
      set('time', new Date(d.serverTime).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' }) + ' IST');
    })
    .catch(() => {
      document.getElementById('status').className = 'status bad';
      set('statusText', 'Could not reach /api/health');
    });
</script>
</body>
</html>
